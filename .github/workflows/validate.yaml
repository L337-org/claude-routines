name: Validate routines

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  ruff-run:
    # CS.3.1 wants lint and format-check on every pull request, both required. ruff does both,
    # and carries the pydocstyle rules CS.6.12's Google docstring format needs.
    runs-on: [ubuntu-latest]
    name: Run ruff
    # 2s observed - three files.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # From requirements-dev.txt rather than named here, so a developer runs the same
        # versions CI does and a bump is a reviewed change to that file (CS.3.2, DS.2.1).
        run: pip install -r requirements-dev.txt

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  mypy-run:
    # The type half of CS.3.1. Kept a separate job from ruff so a lint failure and a type
    # failure are distinguishable at a glance rather than both reading as "Run ruff".
    runs-on: [ubuntu-latest]
    name: Run mypy
    # 4s observed. Roomier than that: mypy builds a cache on a cold run.
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy scripts/

  action-pins:
    # Ported from L337-org/apt's job of the same name, the org's reference implementation, and
    # kept identical in logic to it and to the docker-mcp and send-to-influx copies. The weekly
    # standards reminder is told every repository with a workflow carries this job and so never
    # checks pins itself; without it here, that would leave these pins held by discipline alone.
    runs-on: [ubuntu-latest]
    name: Action pins are immutable
    # A grep over one workflow file.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every third-party `uses:` must name a 40-hex commit SHA
        run: |
          # A tag or branch ref can be repointed by the action's owner at any time, so `@v7`
          # means CI runs whatever that owner last pushed to it. Dependabot bumps the SHA and
          # rewrites the trailing "# vX.Y.Z" comment, so pinning does not mean going stale.
          # Local actions (./...) are exempt.
          #
          # Quoting is optional in YAML and hex is case-insensitive, so a quoted or uppercase
          # SHA is equally pinned and is accepted: a guard that fails a legitimately pinned
          # action is one someone eventually switches off wholesale.
          bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows .github/actions 2>/dev/null \
                | grep -vE "uses:[[:space:]]*[\"']?\./" \
                | grep -vE "uses:[[:space:]]*[\"']?[^[:space:]\"']+@[0-9a-fA-F]{40}[\"']?([[:space:]]|\$)" \
                || true)
          if [ -n "$bad" ]; then
            echo "::error::Every third-party action must be pinned to a full 40-hex commit SHA." >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          echo "All action references are pinned to commit SHAs."


  repo-hygiene:
    # Conventions every repository in this organisation shares, checked by a script that is
    # byte-identical in each of them and verifies itself against a recorded digest. Editing one
    # copy fails this job; divergence between copies is watched separately, on a schedule,
    # because nothing inside one repository could ever see the others.
    #
    # Needs no project install: the script carries its own PEP 723 dependency header.
    runs-on: [ubuntu-latest]
    name: Repository hygiene
    # 3s observed - a git listing, a YAML parse of the workflows, and some regexes.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Repository conventions hold
        run: uv run --script scripts/check-repo-hygiene.py
  validate:
    name: Validate routines
    runs-on: ubuntu-latest
    # 5s observed max - a YAML parse and a field check over 11 small files. Without one a job
    # inherits GitHub's 6-hour default, and a job killed by this timeout reports
    # `conclusion: cancelled` rather than `failure`, so it would notify nobody either way.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_validate_routines.py
      - run: python scripts/validate_routines.py
