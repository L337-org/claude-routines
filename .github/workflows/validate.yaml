name: Validate routines

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  ruff-run:
    # CS.3.1 wants lint and format-check on every pull request, both required. ruff does both,
    # and carries the pydocstyle rules CS.6.12's Google docstring format needs.
    runs-on: [ubuntu-latest]
    name: Run ruff
    # 2s observed - three files.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # From requirements-dev.txt rather than named here, so a developer runs the same
        # versions CI does and a bump is a reviewed change to that file (CS.3.2, DS.2.1).
        run: pip install -r requirements-dev.txt

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  mypy-run:
    # The type half of CS.3.1. Kept a separate job from ruff so a lint failure and a type
    # failure are distinguishable at a glance rather than both reading as "Run ruff".
    runs-on: [ubuntu-latest]
    name: Run mypy
    # 4s observed. Roomier than that: mypy builds a cache on a cold run.
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy scripts/

  action-pins:
    # Every `uses:` names a full commit SHA, checked by the shared copy pinned here. The weekly
    # standards reminder is told every repository with a workflow carries this job and so never
    # checks pins itself; without it here, that would leave these pins held by discipline alone.
    runs-on: [ubuntu-latest]
    name: Action pins are immutable
    # A grep over the workflow files.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every `uses:` must name a 40-hex commit SHA
        uses: L337-org/github-workflows/actions/action-pins@c406e0fddc7d1212c17979cfb667c7cb5d97a6a5 # v1.3.0

  repo-hygiene:
    # Conventions every repository in this organisation shares, checked by the one copy in the
    # shared workflows repository at the commit pinned here.
    runs-on: [ubuntu-latest]
    name: Repository hygiene
    # Seconds: the shared action sets up uv, then runs a git listing, a YAML parse and regexes.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository conventions hold
        uses: L337-org/github-workflows/actions/repo-hygiene@c406e0fddc7d1212c17979cfb667c7cb5d97a6a5 # v1.3.0

  validate:
    name: Validate routines
    runs-on: ubuntu-latest
    # A YAML parse and a field check over the routine files.  Without a bound a hang would hold
    # the run for GitHub's six-hour default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_validate_routines.py
      - run: python scripts/validate_routines.py
